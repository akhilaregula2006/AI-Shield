groups:
  - name: aishield
    rules:
      - alert: AIShieldApiDown
        expr: up{job="aishield-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "AIShield API is unreachable"}

      - alert: AIShieldHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(aishield_prediction_latency_seconds_bucket[5m])) by (le)) > 0.25
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "p95 prediction latency above 250 ms"}

      - alert: AIShieldHigh5xxRate
        expr: sum(rate(aishield_http_requests_total{status=~"5.."}[5m])) / sum(rate(aishield_http_requests_total[5m])) > 0.02
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "More than 2% of requests are failing"}

      - alert: AIShieldDataDrift
        expr: aishield_drift_feature_share >= 0.15
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Feature drift detected; self-healing should retrain (check /admin/heal)"}

      - alert: AIShieldFraudRateAnomaly
        expr: sum(rate(aishield_predictions_total{outcome="fraud"}[15m])) / sum(rate(aishield_predictions_total[15m])) > 0.10
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Flagged-fraud share above 10% (typical is ~1-2%)"}
